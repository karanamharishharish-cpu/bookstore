name: Deploy Bookstore

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets
        run: |
          sed -i "s/__BREVO_API_KEY_PLACEHOLDER__/${{ secrets.BREVO_API_KEY }}/g" js/data.js
          sed -i "s/__GOOGLE_CLIENT_ID_PLACEHOLDER__/${{ secrets.GOOGLE_CLIENT_ID }}/g" js/data.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
