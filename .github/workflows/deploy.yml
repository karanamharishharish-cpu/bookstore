name: Deploy Bookstore

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Confirm server.js exists
        run: |
          if [ ! -f server.js ]; then
            echo "ERROR: server.js not found"; exit 1
          fi
          echo "OK: server.js found — Render will auto-deploy on this push."
