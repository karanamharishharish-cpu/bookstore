<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books | Pagewise Books</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<main>
<h1>All books</h1>
<div class="tools">
  <input type="search" id="q" placeholder="Search by title or author" aria-label="Search books">
  <select id="cat" aria-label="Category"></select>
  <select id="sort" aria-label="Sort">
    <option value="">Sort: Default</option><option value="low">Price: low to high</option>
    <option value="high">Price: high to low</option><option value="title">Title: A to Z</option>
  </select>
  <label><input type="checkbox" id="wo"> Wishlist only</label>
</div>
<p id="count"><small></small></p>
<div class="grid" id="grid"></div>
</main>
<div id="foot"></div>
<script src="js/data.js"></script>
<script src="js/search.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
