<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Pagewise Books</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Sign in</h2>
        
        <div class="auth-grid">
            <!-- Customer Section -->
            <div class="auth-card">
                <h3>Customer</h3>
                <p>Sign in with your Gmail account to order books and track your parcels.</p>
                <div id="demoBox">
                    <form id="demoForm">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="ge" style="display:block; margin-bottom:5px; font-weight:600;">Gmail Address</label>
                            <input type="email" id="ge" name="email" autocomplete="email" placeholder="Enter your Gmail" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <button type="submit" class="btn-primary">Sign in with Gmail</button>
                    </form>
                </div>
                <div id="gbtn" style="margin-top: 15px;"></div>
            </div>

            <!-- Admin Section -->
            <div class="auth-card">
                <h3>Admin</h3>
                <p>For store staff only.</p>
                <form id="adminForm">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="adminEmailInput" style="display:block; margin-bottom:5px; font-weight:600;">Admin Email</label>
                        <input type="email" id="adminEmailInput" name="adminEmail" placeholder="Enter admin email" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                    </div>

                    <!-- Math Captcha Section -->
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="captchaInput" id="captchaQuestion" style="display:block; margin-bottom:5px; font-weight:600;">Solve: </label>
                        <input type="number" id="captchaInput" name="captcha" placeholder="Result" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                    </div>

                    <button type="button" id="sendOtpBtn" class="btn-secondary" style="background: #2a3b6b; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">Send OTP</button>

                    <!-- OTP verification box -->
                    <div id="otpSection" style="display: none; margin-top: 15px;">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="otpInput" style="display:block; margin-bottom:5px; font-weight:600;">Enter OTP</label>
                            <input type="text" id="otpInput" name="otp" placeholder="Enter 6-digit OTP" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <button type="submit" class="btn-primary">Verify & Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Configuration and Login Logic -->
    <script src="js/data.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
