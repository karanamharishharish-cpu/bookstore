<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Pagewise Books</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Sign in</h2>
        
        <div class="auth-grid">
            <!-- Customer Section -->
            <div class="auth-card">
                <h3>Customer</h3>
                <p>Sign in with your Gmail account to order books and track your parcels.</p>
                <div id="demoBox">
                    <form id="demoForm">
                        <input type="email" id="ge" placeholder="Enter your Gmail" required>
                        <button type="submit" class="btn-primary">Sign in with Gmail</button>
                    </form>
                </div>
                <div id="gbtn"></div>
            </div>

            <!-- Admin Section -->
            <div class="auth-card">
                <h3>Admin</h3>
                <p>For store staff only.</p>
                <form id="adminForm">
                    <div class="form-group">
                        <label for="adminEmailInput">Admin Email</label>
                        <input type="email" id="adminEmailInput" placeholder="Enter admin email" required>
                    </div>

                    <!-- Math Captcha Section -->
                    <div class="form-group">
                        <label for="captchaInput" id="captchaQuestion">Solve: </label>
                        <input type="text" id="captchaInput" placeholder="Enter answer" required>
                    </div>

                    <button type="button" id="sendOtpBtn" class="btn-secondary">Send OTP</button>

                    <!-- OTP verification box -->
                    <div id="otpSection" style="display: none; margin-top: 15px;">
                        <div class="form-group">
                            <label for="otpInput">Enter OTP</label>
                            <input type="text" id="otpInput" placeholder="6-digit code">
                        </div>
                        <button type="submit" class="btn-primary">Verify & Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Configuration and Login Logic -->
    <script src="js/data.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
