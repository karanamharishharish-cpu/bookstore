<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagewise Books - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="nav"></div>

    <main class="container">
        <section class="hero">
            <div class="hero-content">
                <h1>Books worth carrying home</h1>
                <p>Browse fiction, biographies, history and technology titles. Search, save favourites, and order in a few clicks.</p>
                <a href="books.html" class="btn-primary">Browse all books</a>
            </div>
            <div class="hero-graphic">
                <div class="bar-chart-visual">
                    <span class="bar-1"></span>
                    <span class="bar-2"></span>
                    <span class="bar-3"></span>
                    <span class="bar-4"></span>
                    <span class="bar-5"></span>
                    <span class="bar-6"></span>
                    <span class="bar-7"></span>
                </div>
            </div>
        </section>

        <section class="featured-section">
            <h2>Featured books</h2>
            <div id="featured-grid" class="grid"></div>
        </section>
    </main>

    <div id="foot"></div>

    <script src="js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const books = getBooks();
            const featuredGrid = $('#featured-grid');
            if (featuredGrid) {
                // Display first 4 books as featured
                featuredGrid.innerHTML = books.slice(0, 4).map(b => cardHTML(b)).join('');
                bindCards(featuredGrid, () => {});
                hydrateCovers(featuredGrid);
            }
        });
    </script>
</body>
</html>
