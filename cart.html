<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart | Pagewise Books</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<main>
<h1>Your cart</h1>
<div id="cartBox"></div>
<p class="notice" id="loginNote" hidden>Please <a href="login.html?next=cart.html">sign in with Gmail</a> to place your order.</p>
<form class="panel" id="checkout" hidden>
  <h2>Checkout</h2>
  <div class="form">
    <label>Full name<input id="name" autocomplete="name" required></label>
    <label>Mobile number<input id="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" required></label>
    <label class="wide">Delivery address<textarea id="addr" rows="3" autocomplete="street-address" required></textarea></label>
    <label>Payment method
      <select id="pay"><option>Cash on delivery</option><option>UPI (GPay, PhonePe, Paytm)</option></select>
    </label>
  </div>
  <p><button class="btn gold" type="submit">Place order</button></p>
</form>
<section id="trackBox" hidden></section>
<div class="modal" id="upiModal" role="dialog" aria-modal="true" aria-labelledby="upiT" hidden>
  <div class="sheet">
    <h2 id="upiT">Pay with UPI</h2>
    <p>Amount to pay: <strong id="upiAmt"></strong></p>
    <a class="btn gold" id="upiLink" href="#">Open UPI app</a>
    <div id="qr"></div>
    <p><small>On a phone the button opens your UPI app. On a computer, scan the QR code with any UPI app. After paying, come back and tap the button below.</small></p>
    <button class="btn" id="upiDone" type="button">I have paid</button>
    <button class="link" id="upiCancel" type="button">Cancel</button>
  </div>
</div>
</main>
<div id="foot"></div>
<script src="js/data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/cart.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
